name: Deploy to Cloudflare

on:
  push:
    branches:
      - master
  workflow_dispatch:

# An in-flight deploy should finish rather than be interrupted half-published;
# a later push supersedes the pending run instead, same rationale as the main
# NumberBroom repo's deploy.yml.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run test suite
        run: npm test

  deploy:
    name: Deploy worker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # wrangler.jsonc's route is the one line here that matters in
      # production: a wrong pattern either fails to bind or, worse, shadows
      # something else on numberbroom.com. Prove the deployed route actually
      # answers on every deploy rather than at review time. A bare GET is
      # Method Not Allowed (405) because Streamable HTTP MCP only accepts
      # POST -- that is the expected, stable signal that the worker is live
      # and bound to this route, not a Cloudflare 522/1016 for an unbound one.
      - name: Verify the deployed route responds
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://numberbroom.com/mcp)
          test "$code" = "405" || { echo "expected 405, got $code"; exit 1; }

      # A browser asking for HTML is not an MCP client and gets the setup page
      # on numberbroom.com instead of the 405 -- see wantsHtml() in src/index.ts.
      #
      # Retried, because a new version takes seconds to reach the edge. The
      # first run of this check (2026-09-14, cee4ca7) fired ~1s after wrangler
      # returned, got the previous version's plain 405 and an empty redirect,
      # and failed a deploy that was in fact live a moment later. The 405 check
      # above cannot see this race: old and new code both answer 405 there.
      - name: Verify a browser is sent to the setup page
        run: |
          for i in $(seq 1 12); do
            loc=$(curl -s -o /dev/null -w '%{redirect_url}' -H 'Accept: text/html' https://numberbroom.com/mcp)
            if [ "$loc" = "https://numberbroom.com/mcp-server" ]; then
              echo "redirect live after attempt $i"; exit 0
            fi
            echo "attempt $i: got '$loc', waiting for the new version to propagate"
            sleep 5
          done
          echo "expected redirect to /mcp-server after 60s, last got '$loc'"; exit 1
