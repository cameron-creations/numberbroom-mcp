name: Deploy to Cloudflare

on:
  push:
    branches:
      - master
  workflow_dispatch:

# An in-flight deploy should finish rather than be interrupted half-published;
# a later push supersedes the pending run instead, same rationale as the main
# NumberBroom repo's deploy.yml.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# Every action is pinned to a commit SHA, not a tag. This workflow holds the
# Cloudflare token for an account shared with other projects and deploys
# straight to numberbroom.com/mcp, where every customer's API key passes
# through; a moved tag in a third-party action would run with both.
# .github/dependabot.yml keeps the pins current, and the trailing comment
# names the tag each SHA was resolved from.
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run test suite
        run: npm test

  deploy:
    name: Deploy worker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # The routes in wrangler.jsonc are the lines here that matter in
      # production: a wrong pattern fails to bind or, worse, shadows something
      # else on numberbroom.com. Each check is retried, because a new version
      # takes seconds to reach the edge (2026-09-14, cee4ca7: a check ~1s after
      # wrangler returned saw the previous version and failed a live deploy).
      #
      # Since 1.1.0 (OAuth) a bare GET on /mcp is the provider's 401 challenge,
      # naming the protected-resource document, where it used to be a 405. That
      # is the signal the new version is live and bound.
      - name: Verify the deployed routes respond
        run: |
          check() {
            for i in $(seq 1 12); do
              if eval "$1"; then echo "ok: $2 (attempt $i)"; return 0; fi
              echo "attempt $i: $2 not yet, waiting for the new version to propagate"
              sleep 5
            done
            echo "FAILED after 60s: $2"; return 1
          }
          check "curl -s -D - -o /dev/null https://numberbroom.com/mcp | tr -d '\r' | grep -qi '^www-authenticate:.*resource_metadata=\"https://numberbroom.com/.well-known/oauth-protected-resource/mcp\"'" \
            "bare GET /mcp answers the OAuth challenge"
          check "test \"\$(curl -s -o /dev/null -w '%{redirect_url}' -H 'Accept: text/html' https://numberbroom.com/mcp)\" = https://numberbroom.com/mcp-server" \
            "a browser on /mcp is sent to the setup page"
          check "curl -s https://numberbroom.com/.well-known/oauth-protected-resource/mcp | grep -q '\"resource\":\"https://numberbroom.com/mcp\"'" \
            "the protected-resource document names https://numberbroom.com/mcp"
          check "curl -s https://numberbroom.com/.well-known/oauth-authorization-server | grep -q '\"authorization_endpoint\":\"https://numberbroom.com/oauth/authorize\"'" \
            "authorization-server metadata is served"
          # The new routes must not shadow the agent discovery files Firebase serves.
          check "test \"\$(curl -s -o /dev/null -w '%{http_code}' https://numberbroom.com/.well-known/api-catalog)\" = 200" \
            "Firebase /.well-known/api-catalog still answers"
          check "test \"\$(curl -s -o /dev/null -w '%{http_code}' https://numberbroom.com/.well-known/mcp/server-card.json)\" = 200" \
            "Firebase /.well-known/mcp/server-card.json still answers"
