name: CI

# Validation for pull requests. Separate from deploy.yml so a PR run never
# fires the deploy job, mirroring the split used in the main NumberBroom repo.

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # wrangler v4 requires Node 22 -- must match deploy.yml.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run test suite
        run: npm test
